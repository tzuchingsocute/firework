<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烟火 · 直播特效</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  /* 影院式深夜色底;OBS 用 ?transparent 得到纯透明 */
  body { background: radial-gradient(120% 90% at 50% 110%, #0d1226 0%, #070a18 48%, #030409 100%); }
  body.transparent { background: transparent !important; }

  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #fx canvas { display: block; }

  .stage-note {
    position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; user-select: none;
    font-family: "Songti SC", "Noto Serif SC", serif;
    color: rgba(235, 225, 200, .34);
    transition: opacity 1.2s;
  }
  .stage-note h1 { font-size: 34px; font-weight: 400; letter-spacing: .6em; text-indent: .6em; margin-bottom: 14px; }
  .stage-note p { font: 12px/1.8 -apple-system, "PingFang SC", sans-serif; letter-spacing: .18em; color: rgba(235,225,200,.22); }
  .stage-note.gone { opacity: 0; }
  body.transparent .stage-note { display: none; }

  /* 控制台:底部居中一条,像灯光台,不抢烟花的戏 */
  #console {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 20; display: flex; align-items: center; gap: 6px;
    padding: 8px 10px;
    background: rgba(8, 10, 20, .78);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(235, 200, 130, .16);
    border-radius: 999px;
    font: 12px/1 -apple-system, "PingFang SC", sans-serif;
    color: #cfc8b8;
    transition: opacity .3s, transform .3s;
    white-space: nowrap;
  }
  #console.hidden { opacity: 0; transform: translateX(-50%) translateY(16px); pointer-events: none; }
  #console button {
    border: 0; border-radius: 999px; padding: 8px 13px;
    background: transparent; color: #cfc8b8;
    font: inherit; letter-spacing: .08em; cursor: pointer;
    transition: background .15s, color .15s;
  }
  #console button:hover { background: rgba(235, 200, 130, .14); color: #f4e8cf; }
  #console button.fire {
    background: linear-gradient(135deg, #f6d365 0%, #f0a35e 55%, #e2725b 100%);
    color: #241203; font-weight: 600; padding: 8px 18px;
  }
  #console button.fire:hover { filter: brightness(1.08); }
  #console button.on { background: rgba(246, 211, 101, .22); color: #f6d365; }
  #console .sep { width: 1px; height: 18px; background: rgba(235,200,130,.15); margin: 0 4px; }
  #console .themes { display: flex; gap: 2px; }
  #console .themes button { padding: 8px 9px; }
  #console .themes button.on { background: rgba(235,200,130,.18); color: #f6d365; }
  #console kbd { opacity: .45; font-family: inherit; font-size: 10px; margin-left: 4px; }

  #reveal {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 19; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid rgba(235,200,130,.2);
    background: rgba(8,10,20,.78); color: #f6d365;
    font-size: 16px; cursor: pointer; display: none;
  }
  body.console-hidden #reveal { display: block; }
</style>
</head>
<body>
  <div class="stage-note" id="stage-note">
    <h1>烟火</h1>
    <p>点击夜空任意处燃放 · F 单发 / G 齐放 / A 连放</p>
  </div>

  <div id="fx"></div>

  <div id="console">
    <button class="fire" id="b-fire">燃放<kbd>F</kbd></button>
    <button id="b-burst">齐放<kbd>G</kbd></button>
    <button id="b-auto">连放<kbd>A</kbd></button>
    <div class="sep"></div>
    <div class="themes" id="themes">
      <button data-t="liujin" class="on">鎏金<kbd>1</kbd></button>
      <button data-t="jiguang">极光<kbd>2</kbd></button>
      <button data-t="feiying">绯樱<kbd>3</kbd></button>
      <button data-t="binglan">冰蓝<kbd>4</kbd></button>
      <button data-t="nihong">霓虹<kbd>5</kbd></button>
    </div>
    <div class="sep"></div>
    <button id="b-clear">清场<kbd>C</kbd></button>
    <button id="b-hide">隐藏<kbd>H</kbd></button>
  </div>
  <button id="reveal" title="显示控制台 (H)">✦</button>

<script>
(function () {
  'use strict';
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const randi = (a, b) => Math.floor(rand(a, b + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  const params = new URLSearchParams(location.search);
  if (params.has('transparent')) document.body.classList.add('transparent');

  const stage = document.getElementById('fx');
  const canvas = document.createElement('canvas');
  stage.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- 发光贴图:每种色相预渲染一张径向渐变,drawImage 远比逐粒子渐变便宜 ----
  const sprites = new Map();
  function sprite(hue, whiteCore) {
    const key = Math.round(hue / 6) * 6 + (whiteCore ? 'w' : 'c');
    if (sprites.has(key)) return sprites.get(key);
    const s = 64, c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    if (whiteCore) {
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.18, `hsla(${hue},100%,78%,.95)`);
      grad.addColorStop(0.45, `hsla(${hue},100%,58%,.42)`);
      grad.addColorStop(1, `hsla(${hue},100%,50%,0)`);
    } else {
      grad.addColorStop(0, `hsla(${hue},100%,80%,1)`);
      grad.addColorStop(0.35, `hsla(${hue},100%,60%,.5)`);
      grad.addColorStop(1, `hsla(${hue},100%,50%,0)`);
    }
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
    sprites.set(key, c);
    return c;
  }

  // ---- 主题:每个都是一套完整的色彩叙事 ----
  const THEMES = {
    liujin:  { hues: [38, 45, 30, 52],    accent: 45,  ember: 32,  willow: true  },
    jiguang: { hues: [150, 168, 190, 275], accent: 160, ember: 170, willow: false },
    feiying: { hues: [330, 345, 315, 8],  accent: 335, ember: 340, willow: false },
    binglan: { hues: [198, 212, 225, 190], accent: 205, ember: 210, willow: false },
    nihong:  { hues: null,                accent: null, ember: null, willow: false } // 全色域
  };
  let themeName = 'liujin';
  const themeHue = () => {
    const t = THEMES[themeName];
    return t.hues ? pick(t.hues) + rand(-8, 8) : rand(0, 360);
  };
  const themeEmber = () => {
    const t = THEMES[themeName];
    return t.ember != null ? t.ember + rand(-10, 10) : rand(0, 360);
  };

  // ---- 实体 ----
  const rockets = [], sparks = [], flashes = [], rings = [], embers = [];
  const MAX_SPARKS = 1600;

  function launchRocket(tx, ty, opts = {}) {
    const sx = tx != null ? tx + rand(-30, 30) : rand(W * 0.15, W * 0.85);
    const targetY = ty != null ? ty : rand(H * 0.12, H * 0.45);
    const hue = opts.hue != null ? opts.hue : themeHue();
    rockets.push({
      x: sx, y: H + 10,
      vx: rand(-0.6, 0.6),
      vy: -rand(H * 0.011, H * 0.014),
      targetY, hue,
      size: opts.size || rand(0.85, 1.25),
      type: opts.type || pickType(),
      trail: []
    });
  }

  function pickType() {
    const t = THEMES[themeName];
    const r = Math.random();
    if (t.willow && r < 0.3) return 'willow';
    if (r < 0.34) return 'peony';
    if (r < 0.52) return 'chrys';
    if (r < 0.68) return 'ring';
    if (r < 0.84) return 'double';
    return 'strobe';
  }

  function addSpark(x, y, angle, speed, hue, o = {}) {
    if (sparks.length >= MAX_SPARKS) return;
    const depth = o.depth != null ? o.depth : rand(0.55, 1.35); // 景深:远的暗而小、虚
    sparks.push({
      x, y, px: x, py: y,
      vx: Math.cos(angle) * speed * depth,
      vy: Math.sin(angle) * speed * depth,
      hue, depth,
      life: 0,
      ttl: o.ttl || rand(55, 95),
      drag: o.drag || 0.962,
      grav: o.grav != null ? o.grav : 0.045,
      size: (o.size || rand(1.6, 2.6)) * depth,
      strobe: o.strobe || 0,
      twinkle: Math.random() < 0.25,
      seed: Math.random() * TAU,
      trail: o.trail !== false,
      split: o.split || 0,
      whiteCore: Math.random() < 0.5
    });
  }

  function explode(x, y, hue, size, type) {
    const R = Math.min(W, H) * 0.0022 * size; // 基准速度随屏幕缩放
    flashes.push({ x, y, hue, life: 0, ttl: 14, r: 90 * size });
    rings.push({ x, y, hue, life: 0, ttl: 13, r: 8, maxR: 150 * size, w: 3.2 });

    if (type === 'peony' || type === 'double') {
      const n = Math.round(90 * size);
      for (let i = 0; i < n; i++) {
        const a = rand(0, TAU), sp = R * rand(2.6, 5.4) * Math.pow(Math.random(), 0.35);
        addSpark(x, y, a, sp, hue + rand(-12, 12), { ttl: rand(50, 85), size: rand(1.9, 3.1) });
      }
      if (type === 'double') {
        const h2 = themeHue();
        for (let i = 0; i < 50 * size; i++) {
          const a = rand(0, TAU);
          addSpark(x, y, a, R * rand(1.1, 2.0), h2, { ttl: rand(65, 100), depth: rand(0.8, 1.2), whiteCore: true });
        }
        rings.push({ x, y, hue: h2, life: -5, ttl: 12, r: 8, maxR: 90 * size, w: 2 });
      }
    } else if (type === 'chrys') {
      const n = Math.round(110 * size);
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU + rand(-0.03, 0.03);
        addSpark(x, y, a, R * rand(3.4, 4.2), hue + rand(-8, 8), {
          ttl: rand(70, 105), drag: 0.968, grav: 0.055, split: Math.random() < 0.3 ? randi(40, 60) : 0
        });
      }
    } else if (type === 'ring') {
      const n = 70, tilt = rand(0.35, 0.8), rot = rand(0, TAU);
      const h2 = themeHue();
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU;
        const vx = Math.cos(a) * R * 4.0, vy = Math.sin(a) * R * 4.0 * tilt;
        const rx = vx * Math.cos(rot) - vy * Math.sin(rot);
        const ry = vx * Math.sin(rot) + vy * Math.cos(rot);
        if (sparks.length < MAX_SPARKS) {
          sparks.push({
            x, y, px: x, py: y, vx: rx, vy: ry, hue: h2, depth: 1,
            life: 0, ttl: rand(60, 80), drag: 0.965, grav: 0.04,
            size: 2.2, strobe: 0, twinkle: false, seed: 0, trail: true, split: 0, whiteCore: true
          });
        }
      }
      for (let i = 0; i < 26; i++) addSpark(x, y, rand(0, TAU), R * rand(0.5, 1.4), hue, { ttl: rand(40, 60) });
    } else if (type === 'willow') {
      const n = Math.round(80 * size);
      for (let i = 0; i < n; i++) {
        const a = rand(0, TAU), sp = R * rand(2.4, 3.8);
        addSpark(x, y, a, sp, rand(36, 50), {
          ttl: rand(150, 220), drag: 0.982, grav: 0.028, size: rand(1.3, 2.0), strobe: 0
        });
      }
    } else if (type === 'strobe') {
      const n = Math.round(85 * size);
      const h2 = themeHue();
      for (let i = 0; i < n; i++) {
        const a = rand(0, TAU), sp = R * rand(1.8, 4.0) * Math.pow(Math.random(), 0.4);
        addSpark(x, y, a, sp, Math.random() < 0.6 ? hue : h2, {
          ttl: rand(80, 130), strobe: randi(4, 9), grav: 0.035, whiteCore: true
        });
      }
    }

    // 中心余烬:爆炸后缓缓坠落的金色尘埃
    const ne = Math.round(14 * size);
    for (let i = 0; i < ne; i++) {
      embers.push({
        x: x + rand(-14, 14), y: y + rand(-14, 14),
        vx: rand(-0.5, 0.5), vy: rand(-0.3, 0.6),
        hue: themeEmber(), life: 0, ttl: rand(120, 200),
        size: rand(0.8, 1.8), seed: Math.random() * TAU
      });
    }
    shake = Math.min(shake + 3.2 * size, 9);
  }

  // ---- 主循环 ----
  let shake = 0, last = 0, auto = false, autoTimer = 0;
  let idleFrames = 0;

  function frame(t) {
    requestAnimationFrame(frame);
    const dt = Math.min((t - last) / 16.667, 2.5) || 1;
    last = t;

    const busy = rockets.length || sparks.length || flashes.length || rings.length || embers.length || auto;
    if (!busy) {
      idleFrames++;
      if (idleFrames === 3) ctx.clearRect(0, 0, W, H); // 静止时彻底清空,保证 OBS 全透明
      return;
    }
    idleFrames = 0;

    // 残影衰减:destination-out 让旧帧渐隐到透明(而不是涂黑),拖尾即光轨
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    if (shake > 0.1) {
      ctx.save();
      ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
      shake *= Math.pow(0.86, dt);
    }

    // 自动燃放调度
    if (auto) {
      autoTimer -= dt;
      if (autoTimer <= 0) {
        launchRocket();
        if (Math.random() < 0.3) launchRocket();
        autoTimer = rand(18, 46);
      }
    }

    // 上升的火箭
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.px = r.x; r.py = r.y;
      r.x += r.vx * dt; r.y += r.vy * dt;
      r.vy *= Math.pow(0.995, dt);
      r.trail.push({ x: r.x, y: r.y });
      if (r.trail.length > 9) r.trail.shift();

      ctx.strokeStyle = `hsla(${r.hue},90%,72%,.5)`;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (let j = 0; j < r.trail.length; j++) {
        const p = r.trail[j];
        j ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
      }
      ctx.stroke();
      const sp = sprite(r.hue, true), s = 14;
      ctx.drawImage(sp, r.x - s/2, r.y - s/2, s, s);

      // 上升途中洒落的小火星
      if (Math.random() < 0.5) {
        embers.push({ x: r.x + rand(-2,2), y: r.y + rand(0,6), vx: rand(-0.3,0.3), vy: rand(0.2,0.8),
          hue: r.hue, life: 0, ttl: rand(18, 36), size: rand(0.6, 1.2), seed: 0 });
      }
      if (r.y <= r.targetY || r.vy > -1.2) {
        rockets.splice(i, 1);
        explode(r.x, r.y, r.hue, r.size, r.type);
      }
    }

    // 爆炸闪光:一帧炽白核心 + 大团色晕
    for (let i = flashes.length - 1; i >= 0; i--) {
      const f = flashes[i];
      f.life += dt;
      const k = f.life / f.ttl;
      if (k >= 1) { flashes.splice(i, 1); continue; }
      const a = Math.pow(1 - k, 2.2);
      const r = f.r * (0.7 + k * 1.4);
      const sp = sprite(f.hue, true);
      ctx.globalAlpha = a;
      ctx.drawImage(sp, f.x - r, f.y - r, r * 2, r * 2);
      ctx.globalAlpha = 1;
    }

    // 冲击波环
    for (let i = rings.length - 1; i >= 0; i--) {
      const g = rings[i];
      g.life += dt;
      if (g.life < 0) continue;
      const k = g.life / g.ttl;
      if (k >= 1) { rings.splice(i, 1); continue; }
      const ease = 1 - Math.pow(1 - k, 3);
      const r = g.r + (g.maxR - g.r) * ease;
      ctx.strokeStyle = `hsla(${g.hue},95%,85%,${Math.pow(1 - k, 1.5) * 0.85})`;
      ctx.lineWidth = g.w * (1 - k) + 0.4;
      ctx.beginPath();
      ctx.arc(g.x, g.y, r, 0, TAU);
      ctx.stroke();
    }

    // 火花:光轨线段 + 发光头
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.life += dt;
      if (p.life >= p.ttl) { sparks.splice(i, 1); continue; }
      p.px = p.x; p.py = p.y;
      p.vx *= Math.pow(p.drag, dt);
      p.vy = p.vy * Math.pow(p.drag, dt) + p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;

      // 菊花型的二次爆裂
      if (p.split && p.life >= p.split) {
        p.split = 0;
        for (let j = 0; j < 4; j++) {
          addSpark(p.x, p.y, rand(0, TAU), rand(0.4, 1.2), p.hue, { ttl: rand(20, 40), size: 1.2, depth: p.depth });
        }
      }

      const k = p.life / p.ttl;
      let a = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
      a *= Math.min(p.depth, 1) * 0.9 + 0.1;
      if (p.strobe && Math.floor(p.life / p.strobe) % 2 === 1) a *= 0.06;
      if (p.twinkle) a *= 0.6 + 0.4 * Math.sin(p.seed + p.life * 0.9);
      if (a <= 0.02) continue;

      const dim = p.depth < 0.8 ? 0.55 : 1; // 远景更暗
      ctx.globalAlpha = a * dim;
      if (p.trail) {
        ctx.strokeStyle = `hsla(${p.hue},100%,${p.whiteCore ? 78 : 64}%,.85)`;
        ctx.lineWidth = p.size * (1 - k * 0.5);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }
      const s = p.size * 6.5 * (1 - k * 0.35);
      ctx.drawImage(sprite(p.hue, p.whiteCore), p.x - s/2, p.y - s/2, s, s);
      ctx.globalAlpha = 1;
    }

    // 余烬尘埃
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i];
      e.life += dt;
      if (e.life >= e.ttl) { embers.splice(i, 1); continue; }
      e.vy += 0.012 * dt;
      e.vx += Math.sin(e.seed + e.life * 0.05) * 0.01;
      e.x += e.vx * dt; e.y += e.vy * dt;
      const k = e.life / e.ttl;
      const a = (k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85) * (0.5 + 0.5 * Math.sin(e.seed + e.life * 0.35));
      if (a <= 0.02) continue;
      ctx.globalAlpha = a * 0.8;
      const s = e.size * 4;
      ctx.drawImage(sprite(e.hue, false), e.x - s/2, e.y - s/2, s, s);
      ctx.globalAlpha = 1;
    }

    if (shake > 0.1) ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
  }
  requestAnimationFrame(frame);

  // ---- 控制 ----
  function fire(n = 1, x, y) {
    for (let i = 0; i < n; i++) {
      setTimeout(() => launchRocket(x, y), i * rand(90, 170));
    }
    note.classList.add('gone');
  }
  function setAuto(v) {
    auto = v != null ? v : !auto;
    bAuto.classList.toggle('on', auto);
    if (auto) autoTimer = 0;
    note.classList.add('gone');
  }
  function clearAll() {
    rockets.length = sparks.length = flashes.length = rings.length = embers.length = 0;
    setAuto(false);
    ctx.clearRect(0, 0, W, H);
  }
  function setTheme(name) {
    if (!THEMES[name]) return;
    themeName = name;
    document.querySelectorAll('#themes button').forEach(b => b.classList.toggle('on', b.dataset.t === name));
  }

  const note = document.getElementById('stage-note');
  const bAuto = document.getElementById('b-auto');
  document.getElementById('b-fire').onclick = () => fire(1);
  document.getElementById('b-burst').onclick = () => fire(6);
  bAuto.onclick = () => setAuto();
  document.getElementById('b-clear').onclick = clearAll;
  document.getElementById('themes').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) { setTheme(b.dataset.t); fire(2); }
  });

  const consoleEl = document.getElementById('console');
  function toggleConsole() {
    consoleEl.classList.toggle('hidden');
    document.body.classList.toggle('console-hidden');
  }
  document.getElementById('b-hide').onclick = toggleConsole;
  document.getElementById('reveal').onclick = toggleConsole;

  document.addEventListener('click', e => {
    if (e.target.closest('#console') || e.target.closest('#reveal')) return;
    fire(1, e.clientX, Math.min(e.clientY, H * 0.8));
  });

  const themeKeys = { 1: 'liujin', 2: 'jiguang', 3: 'feiying', 4: 'binglan', 5: 'nihong' };
  document.addEventListener('keydown', e => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'f') fire(1);
    else if (k === 'g') fire(6);
    else if (k === 'a') setAuto();
    else if (k === 'c') clearAll();
    else if (k === 'h') toggleConsole();
    else if (themeKeys[k]) { setTheme(themeKeys[k]); fire(2); }
  });

  window.fireworksControl = {
    launch: (n = 1) => fire(n), burst: () => fire(6),
    auto: setAuto, clear: clearAll, theme: setTheme
  };

  // 开场:一轮编排好的齐放,先声夺人
  setTimeout(() => { fire(1, W * 0.5, H * 0.3); }, 500);
  setTimeout(() => { fire(2, W * 0.28, H * 0.36); }, 1200);
  setTimeout(() => { fire(2, W * 0.72, H * 0.34); }, 1500);
})();
</script>
</body>
