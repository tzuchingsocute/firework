<!doctype html><meta charset="utf-8"><title>Flower Particle Trail Body</title><style>body{background:#11101b;color:#eee;font:16px/1.6 system-ui;margin:20px}canvas{display:block;background:#080b14;border:1px solid #333;max-width:none}button,input{margin:8px}a{color:#dbcfff}</style><h1>Flower · 粒子化流光主体</h1><p>固定 Seed 1201。左：已确认的连续带；右：只替换流光主体为独立粒子。Hero Flower、爆发位置、19颗子粒子、时间轴完全相同。不更新整朵预览或正式直播。</p><button id="play">暂停</button><button id="restart">重播</button><input id="time" type="range" min="0" max="3" step=".005"><strong id="phase"></strong><p id="stats"></p><h2>局部放大 · 同一段历史轨迹 4×</h2><div style="overflow:auto"><canvas id="detail" width="1000" height="330"></canvas></div><h2>完整单条 · 左右各414 × 896</h2><div style="overflow:auto"><canvas id="actual" width="828" height="896" style="width:828px;height:896px"></canvas></div><a href="/previews/trail-to-burst.html">原有四种单条样机</a><script type="module">
import{createTrailToBurst,paintTrailToBurst}from'/src/firework/trail-to-burst-prototype.js';import{createParticleBodyPrototype}from'/src/firework/particle-trail-body-prototype.js';import{sampleHead}from'/src/firework/head-candidate.js';const before=createTrailToBurst(1201),after=createParticleBodyPrototype(1201),slider=document.querySelector('#time'),button=document.querySelector('#play');document.querySelector('#stats').textContent=`拖尾样本 ${before.trails.length} → ${after.marks.length}（每个原间隔只补1颗）；原48颗测试在高速段过稀。19颗爆发子粒子不变。含Head的活跃峰值 63 → ${after.peak}；增量只限独立样机，不提高全局6000预算。无连接线、填充带或整体纹理。`;
function draw(t){let result;for(const id of['detail','actual']){const canvas=document.querySelector('#'+id),ctx=canvas.getContext('2d');ctx.fillStyle='#080b14';ctx.fillRect(0,0,canvas.width,canvas.height);for(let col=0;col<2;col++){ctx.save();ctx.beginPath();ctx.rect(col*(id==='actual'?414:500),0,id==='actual'?414:500,canvas.height);ctx.clip();if(id==='actual')ctx.translate(col*414+300,620);else{const p=sampleHead(before.head,Math.min(t,before.burstTime));ctx.translate(col*500+230,160);ctx.scale(4,4);ctx.translate(-p.x-20,-p.y-30)}result=col?after.render(ctx,t):paintTrailToBurst(ctx,before,t);ctx.restore()}}slider.value=t;document.querySelector('#phase').textContent=`${t.toFixed(2)}s · ${result.stage}`}window.particleBodyPreview={before,after,draw};let playing=true,start=performance.now(),held=0;slider.max=before.duration+.35;button.onclick=()=>{playing=!playing;if(playing)start=performance.now()-held*1000;button.textContent=playing?'暂停':'继续'};document.querySelector('#restart').onclick=()=>{held=0;start=performance.now();playing=true;button.textContent='暂停';draw(0)};slider.oninput=()=>{playing=false;held=+slider.value;button.textContent='继续';draw(held)};function loop(now){if(playing){held=(now-start)/1000%(before.duration+.35);draw(held)}requestAnimationFrame(loop)}draw(0);requestAnimationFrame(loop);
</script>
