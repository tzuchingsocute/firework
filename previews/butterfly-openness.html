<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wing Openness Study</title><style>body{background:#101522;color:#e8e5f4;font:16px system-ui;margin:0}main{max-width:1250px;padding:25px;margin:auto}h1{font-size:23px}h2{font-size:18px;margin-top:35px}canvas{display:block;max-width:100%;height:auto;margin:auto}p{color:#abb7cc}</style><main><h1>Wing Openness · 连续空间开合</h1><p>仅调整局部铰接角度映射，源轮廓与整体透视不变。无Glow测试优先。</p><h2>A · 五档无Glow</h2><canvas id="levels"></canvas><h2>B · 单只连续开合，无Glow</h2><canvas id="motion" width="500" height="360"></canvas><h2>C · 同侧前后翅局部结构（测试色）</h2><canvas id="detail"></canvas><h2>D · 三档展开 × 四种朝向</h2><canvas id="matrix"></canvas><h2>E · 原有Glow</h2><canvas id="glow"></canvas><h2>F · 实际烟花尺寸</h2><canvas id="live"></canvas></main><script type="module">
import{paintButterfly,paintButterflyMatrix,butterflyGeometry,seededButterflies}from'/src/firework/butterfly-shape.js';import{paintDensePeak,createDensePeak}from'/src/firework/dense-peak.js';const poses=[.15,.35,.5,.7,.9].map(openness=>({yaw:0,pitch:0,roll:0,openness,glow:0}));paintButterflyMatrix(document.querySelector('#levels'),poses,5);paintButterflyMatrix(document.querySelector('#glow'),poses.map(v=>({...v,glow:1})),5);const views=[{yaw:0,pitch:0,roll:0},{yaw:-40,pitch:0,roll:0},{yaw:40,pitch:0,roll:0},{yaw:32,pitch:-25,roll:30}];paintButterflyMatrix(document.querySelector('#matrix'),[.25,.55,.85].flatMap(openness=>views.map(v=>({...v,openness,glow:0}))),4);
const detail=document.querySelector('#detail');detail.width=1000;detail.height=260;const d=detail.getContext('2d');d.fillStyle='#101522';d.fillRect(0,0,1000,260);[.15,.35,.55,.85].forEach((openness,i)=>{for(const s of butterflyGeometry({openness},95).filter(s=>s.side===1)){d.beginPath();s.points.forEach((p,k)=>k?d.lineTo(i*250+85+p.x,125+p.y):d.moveTo(i*250+85+p.x,125+p.y));d.closePath();d.fillStyle=s.wing?'rgba(145,208,244,.5)':'rgba(244,185,225,.5)';d.fill();d.strokeStyle=s.wing?'#9ed4ff':'#ffc4e6';d.stroke()}});
const m=document.querySelector('#motion'),ctx=m.getContext('2d');window.drawWingMotion=t=>{const openness=.15+.75*(.5-.5*Math.cos(t*Math.PI/2));ctx.fillStyle='#101522';ctx.fillRect(0,0,500,360);paintButterfly(ctx,{yaw:-16,pitch:12,roll:0,openness},250,170,100,0)};function tick(t){window.drawWingMotion(t/1000);requestAnimationFrame(tick)}requestAnimationFrame(tick);
const c=document.querySelector('#live');c.width=414;c.height=896;const x=c.getContext('2d');x.fillStyle='#15202b';x.fillRect(0,0,414,896);x.save();x.translate(207,390);x.scale(.48,.48);paintDensePeak(x,createDensePeak(1201));x.restore();[[78,330],[315,330],[128,530],[300,470],[190,245],[68,445]].forEach(([a,b],i)=>paintButterfly(x,seededButterflies()[i],a,b,9,1));
</script></html>
