<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Butterfly Shape Study</title><style>body{background:#101522;color:#e8e4f4;font:16px system-ui;margin:0}main{max-width:1250px;margin:auto;padding:25px}h1{font-size:23px}h2{font-size:18px;margin-top:35px}p{color:#aab3ca}canvas{max-width:100%;height:auto;display:block;margin:auto}</style><main><h1>发光蝴蝶 · 统一几何与翅膀折叠</h1><p>左右前后翅共用基础轮廓，绕中轴铰接收拢，再进行Yaw / Pitch / Roll旋转与透视投影。Seed 6062。</p><h2>A · 连续展开参数的五个采样</h2><canvas id="open"></canvas><h2>B · 固定70%展开的空间视角</h2><canvas id="views"></canvas><h2>C · 十二个固定随机样本</h2><canvas id="mixed"></canvas><h2>D · 清晰 / 适度柔光 / 较高亮</h2><canvas id="material"></canvas><h2>E · 414 × 896 实际使用尺度（未修改的静态烟花背景）</h2><canvas id="live"></canvas></main><script type="module">
import{paintButterfly,paintButterflyMatrix,opennessViews,perspectiveViews,seededButterflies}from'/src/firework/butterfly-shape.js';import{createDensePeak,paintDensePeak}from'/src/firework/dense-peak.js';
paintButterflyMatrix(document.querySelector('#open'),opennessViews,5);paintButterflyMatrix(document.querySelector('#views'),perspectiveViews,3);const samples=seededButterflies(6062);paintButterflyMatrix(document.querySelector('#mixed'),samples,4);paintButterflyMatrix(document.querySelector('#material'),[samples[0],samples[3],samples[7]].flatMap(v=>[.15,1,1.7].map((glow,i)=>({...v,glow,name:['Clear','Soft','Bright'][i]}))),3);
const c=document.querySelector('#live');c.width=414;c.height=896;const ctx=c.getContext('2d');ctx.fillStyle='#15202b';ctx.fillRect(0,0,414,896);ctx.save();ctx.translate(207,390);ctx.scale(.48,.48);paintDensePeak(ctx,createDensePeak(1201));ctx.restore();[[78,330],[315,330],[128,530],[300,470],[190,245],[68,445]].forEach(([x,y],i)=>paintButterfly(ctx,samples[i],x,y,7+i%3*2,1));
</script></html>
