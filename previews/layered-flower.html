<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Petal Proportion and Layering</title><style>body{background:#101522;color:#e9e4f4;font:16px system-ui;margin:0}main{max-width:1150px;padding:25px;margin:auto}h1{font-size:23px}h2{font-size:18px;margin-top:35px}p{color:#aab5cb}canvas{display:block;max-width:100%;height:auto;margin:auto}</style><main><h1>五瓣比例与独立叠放</h1><p>五片独立圆弧花瓣。五色仅用于结构诊断，正式候选为轻微明暗差的粉白色。建议先比较0.65＋Natural。</p><h2>A · 当前B版五色结构 / 中心放大</h2><canvas id="old"></canvas><h2>B · 0.55 / 0.65 / 0.75，五色诊断</h2><canvas id="ratios"></canvas><h2>C · Minimal / Natural / Moderate重叠</h2><canvas id="overlap"></canvas><h2>D · 五色 / 粉白层次 / 原有Glow</h2><canvas id="material"></canvas><h2>E · 推荐候选中心</h2><canvas id="detail"></canvas><h2>F · 414 × 896实际尺寸</h2><canvas id="live"></canvas><h2>参考对照</h2><p>蓝色参考原图当前不可访问，此项未完成，未使用其他图片替代。</p></main><script type="module">
import{paintLayeredFlower,paintOldStructure}from'/src/firework/layered-flower.js';import{paintDensePeak,createDensePeak}from'/src/firework/dense-peak.js';function canvas(id,w,h){const c=document.querySelector('#'+id);c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#101522';ctx.fillRect(0,0,w,h);return ctx}function label(c,t,x,y){c.fillStyle='#dfe5f4';c.font='14px sans-serif';c.textAlign='center';c.fillText(t,x,y)}const old=canvas('old',700,330);paintOldStructure(old,175,150,100);old.save();old.beginPath();old.rect(350,0,350,300);old.clip();paintOldStructure(old,525,150,300);old.restore();const ratios=canvas('ratios',900,330);[.55,.65,.75].forEach((ratio,i)=>{paintLayeredFlower(ratios,i*300+150,145,100,{ratio,diagnostic:true});label(ratios,`${ratio}`,i*300+150,310)});const o=canvas('overlap',900,330);['minimal','natural','moderate'].forEach((overlap,i)=>{paintLayeredFlower(o,i*300+150,145,100,{overlap,diagnostic:true});label(o,overlap,i*300+150,310)});const m=canvas('material',900,330);[0,1,2].forEach(i=>paintLayeredFlower(m,i*300+150,145,100,{diagnostic:i===0,glow:i===2}));const d=canvas('detail',500,400);paintLayeredFlower(d,250,200,330,{diagnostic:true});const l=canvas('live',414,896);l.save();l.translate(207,390);l.scale(.48,.48);paintDensePeak(l,createDensePeak(1201));l.restore();[[80,330,11],[310,340,10],[120,520,8],[290,490,8]].forEach(([x,y,s])=>paintLayeredFlower(l,x,y,s,{glow:true}));
</script></html>
