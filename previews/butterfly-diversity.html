<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Butterfly Perspective Diversity</title><style>body{margin:0;background:#101522;color:#e9e4f4;font:16px system-ui}main{max-width:1300px;margin:auto;padding:25px}h1{font-size:23px}h2{font-size:18px;margin-top:35px}p{color:#acb7cb}canvas{display:block;max-width:100%;height:auto;margin:auto}</style><main><h1>蝴蝶空间朝向分布 · Seed 6062</h1><p>仅改变Yaw / Pitch / Roll采样。固定数量、尺寸、材质、位置；首轮Openness=0.7。</p><h2>A · 十个固定视角</h2><canvas id="fixed"></canvas><h2>B · Before / 原有角度分布，20只</h2><canvas id="before"></canvas><h2>C · After / 分组采样，20只</h2><canvas id="after"></canvas><p id="stats"></p><h2>D · 保留旧版Openness随机值的兼容验证</h2><canvas id="compatible"></canvas><h2>E · 同数量与位置的414 × 896烟花对照（左Before，右After）</h2><canvas id="live"></canvas></main><script type="module">
import{paintButterflyMatrix,paintButterfly,seededButterflies}from'/src/firework/butterfly-shape.js';import{diversityViews,sampleDiverseButterflies}from'/src/firework/butterfly-diversity.js';import{paintDensePeak,createDensePeak}from'/src/firework/dense-peak.js';const before=seededButterflies(6062,20).map(v=>({...v,openness:.7})),after=sampleDiverseButterflies();paintButterflyMatrix(document.querySelector('#fixed'),diversityViews,5);paintButterflyMatrix(document.querySelector('#before'),before,5);paintButterflyMatrix(document.querySelector('#after'),after.samples,5);paintButterflyMatrix(document.querySelector('#compatible'),sampleDiverseButterflies(6062,20,{existingOpenness:true}).samples,5);document.querySelector('#stats').textContent=JSON.stringify({counts:after.counts,rejected:after.rejected});const c=document.querySelector('#live');c.width=828;c.height=896;const ctx=c.getContext('2d'),positions=[[78,330],[315,330],[128,530],[300,470],[190,245],[68,445]];for(let panel=0;panel<2;panel++){ctx.save();ctx.translate(panel*414,0);ctx.fillStyle='#15202b';ctx.fillRect(0,0,414,896);ctx.save();ctx.translate(207,390);ctx.scale(.48,.48);paintDensePeak(ctx,createDensePeak(1201));ctx.restore();positions.forEach(([x,y],i)=>paintButterfly(ctx,(panel?after.samples:before)[i],x,y,9,1));ctx.restore()}
</script></html>
