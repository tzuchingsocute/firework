<!doctype html><meta charset="utf-8"><title>Main tapered trails</title><style>body{background:#11101b;color:#eee;font:16px sans-serif}canvas{max-width:100%;border:1px solid #333}label{display:block}</style><h1>主烟花末端颗粒簇 · Seed 1201</h1><p>左 Before / 右 After；上：单条放大，下：414 × 896 完整烟花。辅助烟花及中心层相同。</p><label>时间 <input id="time" type="range" min="0" max="3.5" step=".01" value=".45"></label><button id="play">播放 / 暂停</button><br><canvas id="detail" width="1000" height="420"></canvas><br><canvas id="full" width="828" height="896"></canvas><script type="module">
import{createLiveFirework,paintLiveFirework}from'/src/firework/live-particles.js';import{paintTrailCandidate}from'/src/firework/trail-candidate.js';import{sampleHead}from'/src/firework/head-candidate.js';
const before=createLiveFirework(1201,{role:'main',tipParticles:false}),after=createLiveFirework(1201,{role:'main'});
const d=document.querySelector('#detail'),f=document.querySelector('#full'),slider=document.querySelector('#time'),id=after.taperedHeads[0];let playing=false,start=0;
function draw(t){slider.value=t;for(const canvas of[d,f]){const ctx=canvas.getContext('2d');ctx.fillStyle='#11101b';ctx.fillRect(0,0,canvas.width,canvas.height)}[before,after].forEach((c,i)=>{const ctx=d.getContext('2d'),trail=c.state.candidate.body.base.trail,h=trail.head.heads.find(h=>h.id===id),q=sampleHead(h,t);ctx.save();ctx.beginPath();ctx.rect(i*500,0,500,420);ctx.clip();ctx.translate(i*500+250,210);ctx.scale(4,4);ctx.translate(-q.x,-q.y);paintTrailCandidate(ctx,trail,t,{headId:id});ctx.restore();const fc=f.getContext('2d');paintLiveFirework(fc,c,t*1000,{x:i*414+207,y:320},{x:i*414,y:0,width:414,height:896})})}slider.oninput=()=>{playing=false;draw(+slider.value)};document.querySelector('#play').onclick=()=>{playing=!playing;start=performance.now()-Number(slider.value)*1000};function frame(now){if(playing)draw((now-start)/1000%3.5);requestAnimationFrame(frame)}draw(.45);requestAnimationFrame(frame);
</script>
