<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Petal Geometry Candidates</title><style>body{margin:0;background:#101522;color:#eae5f4;font:16px system-ui}main{max-width:1150px;margin:auto;padding:25px}h1{font-size:23px}h2{font-size:18px;margin-top:35px}p{color:#aab5ca}canvas{display:block;max-width:100%;height:auto;margin:auto}</style><main><h1>基础花瓣 · 等长A / B / C候选</h1><p>无Glow。固定五个排列角度与花心，仅比较基础花瓣。B为当前优先候选，未替换正式素材。</p><h2>A · 旧瓣与三种新瓣，同长度</h2><canvas id="petals"></canvas><h2>B · B方案根部 / 中外段 / 尖端放大</h2><canvas id="detail"></canvas><h2>C · 原有五瓣排列临时组合</h2><canvas id="flowers"></canvas><h2>D · Before / After B</h2><canvas id="comparison"></canvas></main><script type="module">
import{paintPetal,paintPetalFlower}from'/src/firework/petal-geometry.js';import{flowerContour,paintCleanFlower}from'/src/firework/clean-flower.js';function canvas(id,w,h){const c=document.querySelector('#'+id);c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#101522';ctx.fillRect(0,0,w,h);return ctx}function label(c,t,x,y){c.fillStyle='#e0e5f4';c.font='15px sans-serif';c.textAlign='center';c.fillText(t,x,y)}const p=canvas('petals',1000,330);p.save();p.translate(125,280);p.beginPath();const old=flowerContour(0).slice(0,40);old.forEach((q,i)=>i?p.lineTo(q.x*280,q.y*280+88):p.moveTo(q.x*280,q.y*280+88));p.closePath();p.fillStyle='#f3dcea';p.fill();p.restore();label(p,'Old / extracted outer petal',125,300);['A','B','C'].forEach((t,i)=>{paintPetal(p,t,375+i*250,245,280);label(p,t,375+i*250,300)});
const d=canvas('detail',900,290);[[0,0],[0,-.28],[0,-.55]].forEach(([dx,dy],i)=>{d.save();d.beginPath();d.rect(i*300,0,300,250);d.clip();paintPetal(d,'B',i*300+150,140-dy*650,650);d.restore();label(d,['Root','Middle / outer','Tip'][i],i*300+150,277)});
const f=canvas('flowers',900,320);['A','B','C'].forEach((t,i)=>{paintPetalFlower(f,t,i*300+150,145,100);label(f,t,i*300+150,290)});const b=canvas('comparison',700,340);paintCleanFlower(b,{},175,150,100,{glow:0});paintPetalFlower(b,'B',525,150,100);label(b,'Before',175,310);label(b,'After / B',525,310);
</script></html>
