<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Four / Eight Point Perspective</title><style>body{margin:0;background:#101522;color:#eee7f6;font:16px system-ui}main{max-width:1150px;margin:auto;padding:25px}h1{font-size:23px}h2{font-size:18px;margin-top:35px}canvas{display:block;max-width:100%;height:auto;margin:auto}</style><main><h1>四芒星 / 八芒星 · 共用透视测试</h1><h2>A · 九组同角度，无Glow；每格左四芒、右八芒</h2><canvas id="fixed"></canvas><h2>B · 八芒星中心与短芒放大</h2><canvas id="detail"></canvas><h2>C · 连续旋转，无Glow</h2><canvas id="motion" width="500" height="340"></canvas><h2>D · 各12颗，Seed 6111；每格左四芒、右八芒</h2><canvas id="random"></canvas><h2>E · 414 × 896，原有Glow与小尺寸</h2><canvas id="live"></canvas></main><script type="module">
import{compatibilityViews,compatibilityMatrix,compatibleRandomViews,paintCompatibleStar}from'/src/firework/star-compatibility.js';import{createDensePeak,paintDensePeak}from'/src/firework/dense-peak.js';compatibilityMatrix(document.querySelector('#fixed'),compatibilityViews);compatibilityMatrix(document.querySelector('#detail'),compatibilityViews,{paired:false,zoom:true});const views=compatibleRandomViews();compatibilityMatrix(document.querySelector('#random'),views);const c=document.querySelector('#motion'),ctx=c.getContext('2d');window.drawStarRotation=t=>{ctx.fillStyle='#101522';ctx.fillRect(0,0,500,340);const phase=Math.floor(t/2)%4,u=t%2,angle=Math.sin(u*Math.PI)*48,v=phase===0?{yaw:angle,pitch:0,roll:0}:phase===1?{yaw:0,pitch:angle,roll:0}:phase===2?{yaw:0,pitch:0,roll:angle}:{yaw:angle,pitch:-angle*.65,roll:angle*.5};paintCompatibleStar(ctx,'eight',v,250,160,100)};window.starAuto=true;function tick(t){if(window.starAuto)window.drawStarRotation(t/1000);requestAnimationFrame(tick)}requestAnimationFrame(tick);const live=document.querySelector('#live');live.width=414;live.height=896;const x=live.getContext('2d');x.fillStyle='#15202b';x.fillRect(0,0,414,896);x.save();x.translate(207,390);x.scale(.48,.48);paintDensePeak(x,createDensePeak(1201));x.restore();[[80,310],[315,320],[115,525],[300,485],[190,245],[65,440]].forEach(([a,b],i)=>paintCompatibleStar(x,i%2?'eight':'four',views[i],a,b,9,true));
</script></html>
