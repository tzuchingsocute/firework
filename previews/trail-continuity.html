<!doctype html><meta charset="utf-8"><title>Trail Continuity</title><style>body{background:#15202b;color:#eee;font:16px system-ui}canvas{max-width:100%;height:auto;display:block}</style><h1>Trail Continuity · Seed 1201</h1><p>左 Before / 右 After。相同粒子、宽度材质、运动与生命周期，仅补主体存活样本间的曲线空隙。</p><h2>单条流光 · 采样诊断</h2><canvas id="single" width="828" height="450"></canvas><h2>仅测试：实际Head路径、出生点与当前存活拖尾点</h2><canvas id="diagnostic" width="828" height="450"></canvas><h2>单朵完整烟花</h2><canvas id="full" width="828" height="896"></canvas><h2>浅色背景 / 深色背景</h2><canvas id="backgrounds" width="828" height="896"></canvas><script type="module">
import{createLiveFirework,paintLiveFirework}from'/src/firework/live-particles.js';import{paintTrailCandidate}from'/src/firework/trail-candidate.js';import{continuitySegments}from'/src/firework/trail-continuity.js';import{sampleHead}from'/src/firework/head-candidate.js';const state=createLiveFirework(1201),trail=state.state.candidate.body.base.trail;const chosen=trail.head.heads.find(h=>trail.head.tail.peak.strokes[h.id].spec==='bold'&&state.state.candidate.body.events[h.id].mode==='natural');const path=Array.from({length:161},(_,i)=>sampleHead(chosen,chosen.birth+chosen.duration*i/160)),xs=path.map(p=>p.x),ys=path.map(p=>p.y),mx=(Math.min(...xs)+Math.max(...xs))/2,my=(Math.min(...ys)+Math.max(...ys))/2,fit=Math.min(350/(Math.max(...xs)-Math.min(...xs)),350/(Math.max(...ys)-Math.min(...ys)));window.drawTrailProof=t=>{const c=document.querySelector('#single'),ctx=c.getContext('2d',{willReadFrequently:true});ctx.fillStyle='#15202b';ctx.fillRect(0,0,828,450);for(let i=0;i<2;i++){ctx.save();ctx.beginPath();ctx.rect(i*414,0,414,450);ctx.clip();ctx.translate(i*414+207,260);ctx.scale(fit,fit);ctx.translate(-mx,-my);paintTrailCandidate(ctx,trail,t,{headId:chosen.id,continuity:i===1});ctx.restore()}const dg=document.querySelector('#diagnostic'),dc=dg.getContext('2d',{willReadFrequently:true});dc.fillStyle='#15202b';dc.fillRect(0,0,828,450);dc.save();dc.translate(414,225);dc.scale(fit,fit);dc.translate(-mx,-my);dc.strokeStyle='#697d98';dc.lineWidth=1/fit;dc.beginPath();path.forEach((p,i)=>i?dc.lineTo(p.x,p.y):dc.moveTo(p.x,p.y));dc.stroke();for(const p of trail.particles.filter(p=>p.headId===chosen.id&&p.birth<=t)){const q=sampleHead(chosen,p.birth);dc.fillStyle='#84b8ff';dc.beginPath();dc.arc(q.x,q.y,2/fit,0,Math.PI*2);dc.fill()}const segs=continuitySegments(trail,t,{headId:chosen.id});for(const s of segs){dc.strokeStyle='#a2f5bf';dc.beginPath();const p=s.curve;dc.moveTo(p[0].x,p[0].y);dc.bezierCurveTo(p[1].x,p[1].y,p[2].x,p[2].y,p[3].x,p[3].y);dc.stroke()}dc.restore();dc.fillStyle='#ddd';dc.fillText('灰：Head真实路径 / 蓝：出生采样位置 / 绿：独立运动后的存活连接',20,425);const c2=document.querySelector('#full'),q=c2.getContext('2d',{willReadFrequently:true});q.fillStyle='#15202b';q.fillRect(0,0,828,896);for(let i=0;i<2;i++){q.save();q.translate(i*414,0);paintLiveFirework(q,state,t*1000,{x:207,y:320},{x:0,y:0,width:414,height:896},1,{continuity:i===1});q.restore()}const bg=document.querySelector('#backgrounds'),b=bg.getContext('2d',{willReadFrequently:true});for(let i=0;i<2;i++){b.fillStyle=i?'#101522':'#e7e2dc';b.fillRect(i*414,0,414,896);b.save();b.translate(i*414,0);paintLiveFirework(b,state,t*1000,{x:207,y:320},{x:0,y:0,width:414,height:896});b.restore()}};window.trailProofAuto=true;function tick(now){if(window.trailProofAuto)window.drawTrailProof(now/1000%4);requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script>
