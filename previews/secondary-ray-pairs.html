<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secondary Ray Pair Distribution</title><style>body{margin:0;background:#101522;color:#e9e5f5;font:16px system-ui}main{max-width:1150px;margin:auto;padding:25px}h1{font-size:23px}h2{font-size:18px;margin-top:35px}p{color:#aeb8cc}canvas{display:block;max-width:100%;height:auto;margin:auto}</style><main><h1>辅助星芒 · 偶数成对分布</h1><p>仅0 / 2 / 4 / 6。成对角度差约180°，最大扰动±4°；与主芒间隔至少17°，辅助芒之间至少19.5°。</p><h2>A · 0 / 2 / 4 / 6，无Glow</h2><canvas id="counts"></canvas><h2>B · 12个配对样本，每排2 / 4 / 6个辅助芒</h2><canvas id="pairs"></canvas><h2>C · 对称、角度偏移、长度差异、两者兼有</h2><canvas id="asymmetry"></canvas><h2>D · 6辅助芒高密度</h2><canvas id="dense"></canvas></main><script type="module">
import{secondaryMatrix}from'/src/firework/secondary-rays.js';secondaryMatrix(document.querySelector('#counts'),[0,2,4,6].map(secondaryRayCount=>({secondaryRayCount,seed:6019})));secondaryMatrix(document.querySelector('#pairs'),[2,4,6].flatMap(secondaryRayCount=>Array.from({length:4},(_,i)=>({secondaryRayCount,seed:6019+i*47,name:`${secondaryRayCount} rays / seed ${6019+i*47}`}))));secondaryMatrix(document.querySelector('#asymmetry'),[{pairAngleVariation:0,pairLengthVariation:false,name:'Symmetric'},{pairAngleVariation:.07,pairLengthVariation:false,name:'Angle variation'},{pairAngleVariation:0,pairLengthVariation:true,name:'Length variation'},{pairAngleVariation:.07,pairLengthVariation:true,name:'Both'}].map(v=>({...v,secondaryRayCount:4,seed:6019})));secondaryMatrix(document.querySelector('#dense'),Array.from({length:8},(_,i)=>({secondaryRayCount:6,seed:6021+i*13,name:`6 rays / seed ${6021+i*13}`})));
</script></html>
