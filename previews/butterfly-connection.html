<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Butterfly Contour Refinement</title><style>body{margin:0;background:#101522;color:#eae6f5;font:16px system-ui}main{max-width:1250px;margin:auto;padding:25px}h1{font-size:23px}h2{font-size:18px;margin-top:35px}p{color:#abb6cd}canvas{display:block;max-width:100%;height:auto;margin:auto}</style><main><h1>蝴蝶翅根连接修正</h1><p>仅调整根部连接与单次覆盖填充，原有展开、三维旋转与材质参数保持一致。</p><h2>连接区域放大 / 无Glow</h2><canvas id="detail"></canvas><h2>A · 无Glow / 上排旧版，下排新版</h2><canvas id="base"></canvas><h2>B · 六视角 / 上两排旧版，下两排新版</h2><canvas id="views"></canvas><h2>C · 原有发光材质 / 上排旧版，下排新版</h2><canvas id="glow"></canvas><h2>D · 414 × 896使用尺度</h2><canvas id="live"></canvas></main><script type="module">
import*as old from'/tests/fixtures/butterfly-before-connection.js';import*as next from'/src/firework/butterfly-shape.js';import{paintDensePeak,createDensePeak}from'/src/firework/dense-peak.js';
function comparison(id,views,cols,glow){const c=document.querySelector('#'+id);c.width=cols*260;c.height=Math.ceil(views.length/cols)*240*2;const ctx=c.getContext('2d');ctx.fillStyle='#101522';ctx.fillRect(0,0,c.width,c.height);const rows=Math.ceil(views.length/cols);for(const [version,m]of [old,next].entries())views.forEach((v,i)=>{const x=i%cols*260+130,y=(Math.floor(i/cols)+version*rows)*240+100;m.paintButterfly(ctx,v,x,y,48,glow);ctx.fillStyle='#dce4f4';ctx.textAlign='center';ctx.font='13px sans-serif';ctx.fillText(`${version?'New':'Old'} / Open ${v.openness}`,x,y+83);ctx.fillText(`Y ${v.yaw} P ${v.pitch} R ${v.roll}`,x,y+105)})}
comparison('detail',[{yaw:0,pitch:0,roll:0,openness:1}],1,0);const detail=document.querySelector('#detail'),dctx=detail.getContext('2d');dctx.fillStyle='#101522';dctx.fillRect(0,0,detail.width,detail.height);[old,next].forEach((m,i)=>{dctx.save();dctx.beginPath();dctx.rect(0,i*240,260,240);dctx.clip();m.paintButterfly(dctx,{openness:1},130,i*240+100,150,0);dctx.restore()});
const poses=[1,.5,.12].map(openness=>({yaw:0,pitch:0,roll:0,openness}));comparison('base',poses,3,0);comparison('views',next.perspectiveViews,3,0);comparison('glow',poses,3,1);const c=document.querySelector('#live');c.width=414;c.height=896;const ctx=c.getContext('2d');ctx.fillStyle='#15202b';ctx.fillRect(0,0,414,896);ctx.save();ctx.translate(207,390);ctx.scale(.48,.48);paintDensePeak(ctx,createDensePeak(1201));ctx.restore();[[78,330],[315,330],[128,530],[300,470],[190,245],[68,445]].forEach(([x,y],i)=>next.paintButterfly(ctx,next.seededButterflies()[i],x,y,7+i%3*2,1));
</script></html>
