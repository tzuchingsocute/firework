<!doctype html><meta charset="utf-8"><title>Flower Integration</title><style>body{background:#15202b;color:#eee;font:16px system-ui}canvas{display:block;max-width:100%;height:auto}button{padding:8px}main{max-width:1656px;margin:auto}</style><main><h1>花朵接入 · 独立主烟花候选</h1><p>仅替换已选中Flower槽位。现有随机权重、Head / Trail / Burst运动保持不变。测试强制造型不写入默认配置。</p><button id="replay">重新播放</button><h2>同Seed Before / After · 各414 × 896</h2><canvas id="comparison" width="828" height="896"></canvas><h2>Star / Butterfly / Flower / Mixed · 各414 × 896</h2><canvas id="types" width="1656" height="896"></canvas><h2>Flower 3 / 4 / 5瓣 · Shaped Tip</h2><canvas id="tips" width="1242" height="896"></canvas><h2>Flower 3 / 4 / 5瓣 · Secondary Burst</h2><canvas id="bursts" width="1242" height="896"></canvas><h2>20次随机烟花连续验证</h2><canvas id="sequence" width="414" height="896"></canvas><pre id="stats"></pre></main><script type="module">
import{createFlowerIntegration as make,paintFlowerIntegration as paint,disposeFlowerIntegration as dispose}from'/src/firework/flower-integration.js';const comparison=make(1201),types=['star','butterfly','flower',null].map(testType=>make(1201,{testType})),petals=[3,4,5].map(testPetalCount=>make(1201,{testType:'flower',testPetalCount})),sequence=Array.from({length:20},(_,i)=>make(1201+i*137));function panel(id,items,t,options=()=>({})){const c=document.getElementById(id),ctx=c.getContext('2d');ctx.fillStyle='#15202b';ctx.fillRect(0,0,c.width,c.height);items.forEach((state,i)=>{ctx.save();ctx.beginPath();ctx.rect(i*414,0,414,896);ctx.clip();ctx.translate(i*414+207,340);ctx.scale(.48,.48);paint(ctx,state,t,options(i));ctx.restore()})}window.drawIntegration=time=>{const t=time%4;panel('comparison',[comparison,comparison],t,i=>({before:i===0}));panel('types',types,t);panel('tips',petals,t,()=>({mode:'shaped'}));panel('bursts',petals,t,()=>({mode:'secondary'}));const index=Math.min(19,Math.floor(time/4));panel('sequence',[sequence[index]],time%4)};window.integrationAuto=true;let start=performance.now();document.querySelector('#replay').onclick=()=>start=performance.now();function loop(now){if(window.integrationAuto)window.drawIntegration((now-start)/1000%80);requestAnimationFrame(loop)}requestAnimationFrame(loop);const records=sequence.map(s=>({seed:s.seed,events:s.candidate.body.events.reduce((o,e)=>(o[e.mode]=(o[e.mode]||0)+1,o),{}),tipTypes:s.candidate.body.events.filter(e=>e.mode==='shaped').map(e=>e.type),burstTypes:s.candidate.body.particles.reduce((o,p)=>(o[p.type]=(o[p.type]||0)+1,o),{}),flowers:[...s.flowers].map(([id,f])=>({id,petals:f.flower.petalCount,group:f.group,view:f.view})),errors:s.errors,duration:s.candidate.body.duration}));document.querySelector('#stats').textContent=JSON.stringify({weights:{endings:[.45,.2,.35],special:[.5,.3,.2],petals:[.2,.3,.5]},records},null,2);window.integrationStates={comparison,types,petals,sequence};window.cleanupIntegration=()=>{Object.values(window.integrationStates).flat().forEach(dispose)};
</script>
