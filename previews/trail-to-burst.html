<!doctype html><meta charset="utf-8"><title>Four Trail-to-Burst Variants</title><style>body{background:#11101b;color:#eee;font:16px/1.6 system-ui;margin:24px}canvas{background:#080b14;border:1px solid #333;display:block}#large{width:828px;max-width:100%;height:auto}#mobile{width:414px;height:896px;max-width:none}button{padding:8px;margin:8px}a{color:#dcd0ff}</style><p><a href="/previews/particle-trail-body.html">Flower 主体粒子化 · 前后对照</a></p><h1>四种流光 → 主粒子 → 局部爆发</h1><p>独立动态样机 · Seed 1201 · 不接入直播。上图为2×观察，下图为414×896真实CSS尺寸。自动循环。</p><label>类型 <select id="variant"><option value="star">Star 星芒</option><option value="butterfly">Butterfly 蝴蝶</option><option value="flower" selected>Flower 五瓣花</option><option value="natural">Natural 碎光</option></select></label> <label id="star-options" hidden>主星芒 <select id="star-variant"><option value="eight">八芒星</option><option value="four">四芒星</option></select></label><button id="play">暂停</button><button id="restart">重播</button><input id="scrub" type="range" min="0" max="3" step=".005" value="0"><strong id="phase"></strong><p id="timing"></p><canvas id="large" width="828" height="1000"></canvas><h2>414 × 896 实际显示尺寸</h2><div style="overflow:auto"><canvas id="mobile" width="414" height="896"></canvas></div><p>复用现有 Head 解析轨迹、Trail 独立运动与生命周期、Secondary Burst 触发计划／子粒子采样、现有星芒／蝴蝶／五瓣花轮廓与碎片笔刷。仅在独立样机把同一事件的主粒子和子粒子衔接，正式规则不变。</p><script type="module">
import{createParticleBodyPrototype}from'/src/firework/particle-trail-body-prototype.js';let model=createParticleBodyPrototype(1201),c=model.candidate;const scrub=document.querySelector('#scrub'),button=document.querySelector('#play');scrub.max=c.duration+.35;document.querySelector('#timing').textContent=`0–${c.heroStart.toFixed(2)}s 流光延伸；${c.heroStart.toFixed(2)}–${c.burstTime.toFixed(2)}s 主粒子成为焦点；${c.burstTime.toFixed(2)}s 原位爆发；随后独立扩散消散。${c.children.length} 个子粒子。`;
function draw(t){let result;for(const[id,dpr,y]of[['large',2,375],['mobile',1,620]]){const canvas=document.querySelector('#'+id),ctx=canvas.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#080b14';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.save();ctx.scale(dpr,dpr);ctx.translate(300,y);result=model.render(ctx,t);ctx.restore()}scrub.value=t;document.querySelector('#phase').textContent=`${t.toFixed(2)}s · ${result.stage}`;return result}window.trailBurst={candidate:c,draw};let playing=true,start=performance.now(),held=0;button.onclick=()=>{playing=!playing;if(playing)start=performance.now()-held*1000;button.textContent=playing?'暂停':'继续'};document.querySelector('#restart').onclick=()=>{start=performance.now();held=0;playing=true;button.textContent='暂停';draw(0)};scrub.oninput=()=>{playing=false;held=+scrub.value;button.textContent='继续';draw(held)};function changeType(){const type=document.querySelector('#variant').value;model=createParticleBodyPrototype(1201,{type,starVariant:document.querySelector('#star-variant').value});c=model.candidate;window.trailBurst.candidate=c;document.querySelector('#star-options').hidden=type!=='star';draw(held)}document.querySelector('#variant').onchange=changeType;document.querySelector('#star-variant').onchange=changeType;
function frame(now){if(playing){held=((now-start)/1000)%(c.duration+.35);draw(held)}requestAnimationFrame(frame)}draw(0);requestAnimationFrame(frame);
</script>
