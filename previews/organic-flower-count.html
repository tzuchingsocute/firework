<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Organic Flower Petal Counts</title><style>body{background:#101522;color:#eae5f4;font:16px system-ui;margin:0}main{max-width:1150px;margin:auto;padding:25px}h1{font-size:23px}h2{font-size:18px;margin-top:35px}p{color:#aab6cc}canvas{display:block;max-width:100%;height:auto;margin:auto}</style><main><h1>3 / 4 / 5瓣 · 同源花瓣自然排列</h1><p>独立Seed，20% / 30% / 50%数量抽样。仅组合和比例变化，基础曲线、小花心、投影与材质不变。</p><h2>A · 基础数量</h2><canvas id="counts"></canvas><h2>B · 每种数量：均衡 / 轻微 / 中度错落</h2><canvas id="arrangements"></canvas><h2>C · 等比例 / 长度差 / 长宽差</h2><canvas id="proportions"></canvas><h2>D · 18个固定随机样本</h2><canvas id="random"></canvas><h2>E · 五色诊断</h2><canvas id="diagnostic"></canvas><h2>F · 现有Glow</h2><canvas id="glow"></canvas><h2>G · 原有透视兼容</h2><canvas id="perspective"></canvas><h2>H · 414 × 896实际尺寸</h2><canvas id="live"></canvas><p id="stats"></p></main><script type="module">
import{createOrganicFlower as make,countMatrix as matrix,paintOrganicCount}from'/src/firework/organic-flower-count.js';import{paintDensePeak,createDensePeak}from'/src/firework/dense-peak.js';const base=[3,4,5].map(petalCount=>make(6312,{petalCount,irregularity:0,lengthVariation:0,widthVariation:0}));matrix(document.querySelector('#counts'),base);matrix(document.querySelector('#arrangements'),[3,4,5].flatMap(petalCount=>[0,.4,.85].map(irregularity=>({flower:make(6312,{petalCount,irregularity}),name:`${petalCount} petals / irregularity ${irregularity}`}))));matrix(document.querySelector('#proportions'),[3,4,5].flatMap(petalCount=>[[0,0],[.12,0],[.12,.08]].map(([lengthVariation,widthVariation])=>({flower:make(6312,{petalCount,irregularity:.4,lengthVariation,widthVariation}),name:`${petalCount} / L ${lengthVariation} W ${widthVariation}`}))));const random=Array.from({length:18},(_,i)=>make(6312+i*31));matrix(document.querySelector('#random'),random,6);const reps=[3,4,5].map(petalCount=>make(6312,{petalCount}));matrix(document.querySelector('#diagnostic'),reps.map(flower=>({flower,diagnostic:true})));matrix(document.querySelector('#glow'),reps.map(flower=>({flower,glow:true})));matrix(document.querySelector('#perspective'),reps.flatMap(flower=>[{yaw:0,pitch:0,roll:0},{yaw:-35,pitch:15,roll:0},{yaw:32,pitch:-25,roll:24}].map(view=>({flower,view,name:`${flower.petalCount} / Y ${view.yaw} P ${view.pitch}`}))));const c=document.querySelector('#live');c.width=414;c.height=896;const ctx=c.getContext('2d');ctx.fillStyle='#15202b';ctx.fillRect(0,0,414,896);ctx.save();ctx.translate(207,390);ctx.scale(.48,.48);paintDensePeak(ctx,createDensePeak(1201));ctx.restore();[[80,330,11],[310,340,10],[120,520,8],[290,490,8],[200,250,9],[65,440,8]].forEach(([x,y,s],i)=>paintOrganicCount(ctx,reps[i%3],x,y,s,{glow:true}));document.querySelector('#stats').textContent=JSON.stringify(Object.fromEntries([3,4,5].map(n=>[n,random.filter(f=>f.petalCount===n).length])));
</script></html>
