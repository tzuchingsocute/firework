<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Continuous Petal Reconstruction</title><style>body{margin:0;background:#101522;color:#ece5f4;font:16px system-ui}main{max-width:1200px;padding:25px;margin:auto}h1{font-size:23px}h2{font-size:18px;margin-top:35px}p{color:#abb5cc}canvas{display:block;max-width:100%;height:auto;margin:auto}</style><main><h1>连续曲线花瓣 · 独立几何重建</h1><p>以根部、两侧最宽位置和圆弧冠顶建立连续切线。无Glow、无随机噪声。先验收单瓣，五瓣仅临时验证。</p><h2>A · 旧B / 新B，同长度与基准宽度</h2><canvas id="before"></canvas><h2>B · Rounded A / Natural B / Elongated C</h2><canvas id="candidates"></canvas><h2>C · B控制点与切线</h2><canvas id="controls"></canvas><h2>D · 锁定布局的五瓣组合</h2><canvas id="flowers"></canvas><h2>E · 旧版 / 新B完整花朵</h2><canvas id="comparison"></canvas><h2>F · 黑色剪影，无材质</h2><canvas id="silhouette"></canvas><h2>G · 原烟花使用尺度，无复杂Glow</h2><canvas id="live"></canvas></main><script type="module">
import{paintContinuousPetal,paintContinuousFlower}from'/src/firework/continuous-petal.js';import{paintOrganicPetal,paintOrganicFlower}from'/src/firework/organic-petals.js';function canvas(id,w,h,bg='#101522'){const c=document.querySelector('#'+id);c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);return ctx}function label(c,t,x,y){c.fillStyle='#dfe5f4';c.font='14px sans-serif';c.textAlign='center';c.fillText(t,x,y)}const b=canvas('before',700,350);paintOrganicPetal(b,'B',175,275,350);paintContinuousPetal(b,'B',525,275,196);label(b,'Old / B',175,325);label(b,'New / continuous B',525,325);const c=canvas('candidates',900,350);['A','B','C'].forEach((v,i)=>{paintContinuousPetal(c,v,i*300+150,275,196);label(c,v,i*300+150,325)});const p=canvas('controls',500,430);paintContinuousPetal(p,'B',250,370,300,{controls:true});const f=canvas('flowers',900,330);['A','B','C'].forEach((v,i)=>{paintContinuousFlower(f,v,{x:i*300+150,y:145,size:100});label(f,v,i*300+150,310)});const a=canvas('comparison',700,330);paintOrganicFlower(a,'B',{x:175,y:150,size:100});paintContinuousFlower(a,'B',{x:525,y:150,size:100});label(a,'Old B',175,310);label(a,'New B',525,310);const s=canvas('silhouette',700,350,'#eceaf0');paintContinuousPetal(s,'B',175,275,196,{color:'#000'});const tmp=document.createElement('canvas');tmp.width=tmp.height=300;const t=tmp.getContext('2d');paintContinuousFlower(t,'B',{x:150,y:150,size:100});t.globalCompositeOperation='source-in';t.fillStyle='#000';t.fillRect(0,0,300,300);s.drawImage(tmp,350,15);const l=canvas('live',414,896);[[100,300,11],[300,330,10],[140,520,8],[290,490,8]].forEach(([x,y,size])=>paintContinuousFlower(l,'B',{x,y,size}));
</script></html>
