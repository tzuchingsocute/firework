<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Petal Root Transition</title><style>body{margin:0;background:#101522;color:#eae4f4;font:16px system-ui}main{max-width:1250px;margin:auto;padding:25px}h1{font-size:23px}h2{font-size:18px;margin-top:35px}p{color:#abb6cb}canvas{display:block;max-width:100%;height:auto;margin:auto}</style><main><h1>花瓣根部曲线 · 局部过渡候选</h1><p>统一B排列、6%小花心、整体尺寸与中外段。仅调整根部内侧控制点与闭合圆滑度，无花蕊。</p><h2>A · Before / Gentle / Balanced / Rounded，无Glow</h2><canvas id="comparison"></canvas><h2>B · 根部与负空间放大，同一裁切</h2><canvas id="detail"></canvas><h2>C · B候选完整轮廓与原有Glow</h2><canvas id="glow"></canvas><h2>D · 414 × 896原使用尺度</h2><canvas id="live"></canvas></main><script type="module">
import{paintRootTransition}from'/src/firework/petal-root-transition.js';import{paintDensePeak,createDensePeak}from'/src/firework/dense-peak.js';function canvas(id,w,h){const c=document.querySelector('#'+id);c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#101522';ctx.fillRect(0,0,w,h);return ctx}function label(ctx,text,x,y){ctx.fillStyle='#dfe5f4';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText(text,x,y)}const variants=['before','A','B','C'],c=canvas('comparison',1200,330);variants.forEach((v,i)=>{paintRootTransition(c,v,{x:i*300+150,y:145,size:100});label(c,['Narrow Roots','A / Gentle','B / Balanced','C / Rounded'][i],i*300+150,300)});const d=canvas('detail',1200,330);variants.forEach((v,i)=>{d.save();d.beginPath();d.rect(i*300,0,300,280);d.clip();paintRootTransition(d,v,{x:i*300+150,y:140,size:420});d.restore();label(d,v,i*300+150,310)});const g=canvas('glow',700,330);paintRootTransition(g,'B',{x:175,y:150,size:100});paintRootTransition(g,'B',{x:525,y:150,size:100,glow:true});label(g,'B / no Glow',175,310);label(g,'B / existing Glow',525,310);const l=canvas('live',414,896);l.save();l.translate(207,390);l.scale(.48,.48);paintDensePeak(l,createDensePeak(1201));l.restore();[[80,330,11],[310,340,10],[120,520,8],[290,490,8]].forEach(([x,y,size])=>paintRootTransition(l,'B',{x,y,size,glow:true}));
</script></html>
