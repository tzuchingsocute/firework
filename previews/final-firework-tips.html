const bounds={x:0,y:0,width:414,height:896},composition=composeFireworkGroup(1201,bounds),before=composition.members.map(m=>createLiveFirework(m.seed,{role:m.role,finalTips:false})),after=composition.members.map(m=>createLiveFirework(m.seed,{role:m.role}));window.finalTipsInstances={before,after,composition};const main=after[0],trail=main.state.candidate.body.base.trail;const selected=main.taperedHeads;document.querySelector('#stats').textContent=`选中 ${selected.length} / ${trail.head.heads.length} 条；`+selected.map(id=>`${id}:${trail.head.heads[id].finalTipFamily}`).join(' · ');let playing=false,start=0;const slider=document.querySelector('#time');
