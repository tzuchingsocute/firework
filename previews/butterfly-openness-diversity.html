<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Butterfly Openness Distribution</title><style>body{margin:0;background:#101522;color:#e9e5f5;font:16px system-ui}main{max-width:1300px;margin:auto;padding:25px}h1{font-size:23px}h2{font-size:18px;margin-top:35px}p{color:#acb7cc}canvas{display:block;max-width:100%;height:auto;margin:auto}</style><main><h1>蝴蝶展开分布 · Seed 6062</h1><p>仅改变Openness采样；固定P0-1空间角度、尺寸、位置与材质。</p><h2>A · 四种状态，每组五个正面样本</h2><canvas id="bands"></canvas><h2>B · 20只随机展开，固定正面</h2><canvas id="front"></canvas><h2>C · 原有透视角度＋新展开采样</h2><canvas id="combined"></canvas><p id="stats"></p><h2>D · 同条件Before / After，414 × 896</h2><canvas id="live"></canvas></main><script type="module">
import{createTrailCandidate,paintTrailCandidate}from'/src/firework/trail-candidate.js';import{sampleHead}from'/src/firework/head-candidate.js';const motion=createTrailCandidate(1201);import{paintButterflyMatrix,paintButterfly}from'/src/firework/butterfly-shape.js';import{groupedOpenness,bandExamples}from'/src/firework/butterfly-openness-diversity.js';import{paintDensePeak,createDensePeak}from'/src/firework/dense-peak.js';paintButterflyMatrix(document.querySelector('#bands'),bandExamples(),5);paintButterflyMatrix(document.querySelector('#front'),groupedOpenness(6062,20,{front:true}).samples,5);const data=groupedOpenness();paintButterflyMatrix(document.querySelector('#combined'),data.samples,5);document.querySelector('#stats').textContent=JSON.stringify({counts:data.counts,rejected:data.rejected});const c=document.querySelector('#live');c.width=828;c.height=896;const ctx=c.getContext('2d'),positions=[[78,330],[315,330],[128,530],[300,470],[190,245],[68,445]];window.drawOpennessComparison=t=>{for(let panel=0;panel<2;panel++){ctx.save();ctx.translate(panel*414,0);ctx.fillStyle='#15202b';ctx.fillRect(0,0,414,896);ctx.fillStyle='white';ctx.font='14px sans-serif';ctx.fillText(panel?'After / grouped openness':'Before / uniform openness',10,25);ctx.save();ctx.translate(207,390);ctx.scale(.48,.48);if(t>0)paintTrailCandidate(ctx,motion,t);else paintDensePeak(ctx,createDensePeak(1201));ctx.restore();positions.forEach(([x,y],i)=>{const h=motion.head.heads[i],p=sampleHead(h,t);if(t<=0||p.visible)paintButterfly(ctx,(panel?data.samples:data.before)[i],t>0?207+p.x*.48:x,t>0?390+p.y*.48:y,9,1)});ctx.restore()}};window.drawOpennessComparison(0);
</script></html>
