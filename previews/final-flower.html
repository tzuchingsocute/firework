<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Flower Geometry Reconstruction</title><style>body{background:#101522;color:#eae5f4;font:16px system-ui;margin:0}main{max-width:1150px;padding:25px;margin:auto}h1{font-size:23px}h2{font-size:18px;margin-top:35px}p{color:#aab5cb}canvas{display:block;max-width:100%;height:auto;margin:auto}</style><main><h1>五瓣花完整重建 · 短根圆弧花瓣</h1><p>独立候选，五片圆弧花瓣、6%小花心，局部覆盖一次填充，避免叠加亮斑。无花蕊。</p><h2>A · 单瓣 Old / New，无Glow</h2><canvas id="petal"></canvas><h2>B · Balanced A / Natural B / Open C</h2><canvas id="candidates"></canvas><h2>C · Before / 推荐B，无Glow</h2><canvas id="comparison"></canvas><h2>D · 推荐B放大 / 原有Glow</h2><canvas id="material"></canvas><h2>E · 黑色剪影</h2><canvas id="silhouette"></canvas><h2>F · 烟花实际使用尺度</h2><canvas id="live"></canvas><h2>参考图对照状态</h2><p>当前可访问附件中没有蓝色五瓣花参考原图。此项未完成，未用其他图片冒充参考。</p></main><script type="module">
import{paintBlossom,paintBlossomPetal}from'/src/firework/final-flower.js';import{paintContinuousPetal,paintContinuousFlower}from'/src/firework/continuous-petal.js';import{paintDensePeak,createDensePeak}from'/src/firework/dense-peak.js';function canvas(id,w,h,bg='#101522'){const c=document.querySelector('#'+id);c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);return ctx}function label(c,t,x,y){c.fillStyle='#dfe5f4';c.font='14px sans-serif';c.textAlign='center';c.fillText(t,x,y)}const p=canvas('petal',700,340);paintContinuousPetal(p,'B',175,260,180);paintBlossomPetal(p,525,260,180);label(p,'Old / long tapered base',175,320);label(p,'New / short oval base',525,320);const c=canvas('candidates',900,330);['A','B','C'].forEach((v,i)=>{paintBlossom(c,v,i*300+150,145,100);label(c,['A / Balanced','B / Natural','C / Open'][i],i*300+150,310)});const b=canvas('comparison',700,330);paintContinuousFlower(b,'B',{x:175,y:150,size:100});paintBlossom(b,'B',525,150,100);label(b,'Before',175,310);label(b,'After / B',525,310);const m=canvas('material',700,360);paintBlossom(m,'B',175,165,120);paintBlossom(m,'B',525,165,120,{glow:true});const s=canvas('silhouette',700,340,'#eceaf0');paintBlossomPetal(s,175,270,180,'#000');paintBlossom(s,'B',525,170,110,{color:'#000'});const l=canvas('live',414,896);l.save();l.translate(207,390);l.scale(.48,.48);paintDensePeak(l,createDensePeak(1201));l.restore();[[80,330,11],[310,340,10],[120,520,8],[290,490,8]].forEach(([x,y,size])=>paintBlossom(l,'B',x,y,size,{glow:true}));
</script></html>
