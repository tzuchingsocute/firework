<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Organic Petal Contours</title><style>body{margin:0;background:#101522;color:#eae5f4;font:16px system-ui}main{max-width:1250px;padding:25px;margin:auto}h1{font-size:23px}h2{font-size:18px;margin-top:35px}p{color:#aab5cb}canvas{display:block;max-width:100%;height:auto;margin:auto}</style><main><h1>完整花瓣轮廓 · 自然圆弧候选</h1><p>统一长度、五瓣、小花心6%、B排列，无花蕊。A圆润，B两侧曲率轻微不同，C较宽舒展。未替换正式素材。</p><h2>A · Old / A / B / C等长花瓣</h2><canvas id="petals"></canvas><h2>B · 三种完整五瓣花，无Glow</h2><canvas id="flowers"></canvas><h2>C · B轮廓放大</h2><canvas id="detail"></canvas><h2>D · Before / After B</h2><canvas id="comparison"></canvas><h2>E · 同形 / 轻微自然差异</h2><canvas id="variation"></canvas><h2>F · 无Glow / 原有Glow</h2><canvas id="glow"></canvas><h2>G · 414 × 896原使用尺度</h2><canvas id="live"></canvas></main><script type="module">
import{paintOrganicFlower,paintOrganicPetal}from'/src/firework/organic-petals.js';import{negativeSpaceFlower}from'/src/firework/flower-negative-space.js';import{paintDensePeak,createDensePeak}from'/src/firework/dense-peak.js';function canvas(id,w,h){const c=document.querySelector('#'+id);c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#101522';ctx.fillRect(0,0,w,h);return ctx}function label(c,t,x,y){c.fillStyle='#dfe5f4';c.textAlign='center';c.font='14px sans-serif';c.fillText(t,x,y)}const p=canvas('petals',1100,330);['old','A','B','C'].forEach((v,i)=>{paintOrganicPetal(p,v,i*275+137,245);label(p,v,i*275+137,310)});const f=canvas('flowers',900,330);['A','B','C'].forEach((v,i)=>{paintOrganicFlower(f,v,{x:i*300+150,y:145,size:100});label(f,v,i*300+150,310)});const d=canvas('detail',500,420);paintOrganicPetal(d,'B',250,410,650);const b=canvas('comparison',700,330);negativeSpaceFlower(b,{x:175,y:150,size:100});paintOrganicFlower(b,'B',{x:525,y:150,size:100});label(b,'Before',175,310);label(b,'After / B',525,310);const g=canvas('glow',700,330);paintOrganicFlower(g,'B',{x:175,y:150,size:100});paintOrganicFlower(g,'B',{x:525,y:150,size:100,glow:true});const v=canvas('variation',700,330);paintOrganicFlower(v,'B',{x:175,y:150,size:100});paintOrganicFlower(v,'B',{x:525,y:150,size:100,variation:1});label(v,'Identical base',175,310);label(v,'Restricted tip variation',525,310);const l=canvas('live',414,896);l.save();l.translate(207,390);l.scale(.48,.48);paintDensePeak(l,createDensePeak(1201));l.restore();[[80,330,11],[310,340,10],[120,520,8],[290,490,8]].forEach(([x,y,size])=>paintOrganicFlower(l,'B',{x,y,size,glow:true}));
</script></html>
