<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Flower Center and Negative Space</title><style>body{margin:0;background:#101522;color:#eee6f4;font:16px system-ui}main{max-width:1250px;margin:auto;padding:25px}h1{font-size:23px}h2{font-size:18px;margin-top:35px}canvas{display:block;max-width:100%;height:auto;margin:auto}p{color:#aeb8cb}</style><main><h1>小花心与根部负空间 · 独立候选</h1><p>仅根部锚点和相邻内侧控制点收窄。花瓣中外段不变；无花蕊，无遮罩切缝。</p><h2>A · 旧版 / 10% / 8% / 6% / 5%中心</h2><canvas id="centers"></canvas><h2>B · 轻 / 中 / 明显根部收窄</h2><canvas id="roots"></canvas><h2>C · 局部角度差与负空间</h2><canvas id="spacing"></canvas><h2>D · 根部放大，无Glow</h2><canvas id="detail"></canvas><h2>E · Before / After，无Glow</h2><canvas id="comparison"></canvas><h2>F · 原有Glow</h2><canvas id="glow"></canvas><h2>G · 414 × 896实际尺度</h2><canvas id="live"></canvas></main><script type="module">
import{negativeSpaceFlower}from'/src/firework/flower-negative-space.js';import{paintArrangedFlower}from'/src/firework/petal-arrangement.js';import{paintDensePeak,createDensePeak}from'/src/firework/dense-peak.js';function canvas(id,w,h){const c=document.querySelector('#'+id);c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#101522';ctx.fillRect(0,0,w,h);return ctx}function label(ctx,t,x,y){ctx.fillStyle='#e0e5f3';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText(t,x,y)}const c=canvas('centers',1250,290);paintArrangedFlower(c,'B',125,125,90,.1);label(c,'Before',125,265);[.1,.08,.06,.05].forEach((r,i)=>{negativeSpaceFlower(c,{x:375+i*250,y:125,size:90,centerRatio:r});label(c,`${r*100}% nominal`,375+i*250,265)});for(const id of ['roots','spacing']){const ctx=canvas(id,900,320);(id==='roots'?['A','B','C']:['small','medium','large']).forEach((v,i)=>{negativeSpaceFlower(ctx,{x:i*300+150,y:145,size:100,...(id==='roots'?{root:v}:{spacing:v})});label(ctx,v,i*300+150,295)})}const d=canvas('detail',500,400);negativeSpaceFlower(d,{x:250,y:200,size:350});const b=canvas('comparison',700,330);paintArrangedFlower(b,'B',175,150,100,.1);negativeSpaceFlower(b,{x:525,y:150,size:100});label(b,'Before',175,310);label(b,'After / narrow roots',525,310);const g=canvas('glow',700,330);negativeSpaceFlower(g,{x:175,y:150,size:100});negativeSpaceFlower(g,{x:525,y:150,size:100,glow:true});const l=canvas('live',414,896);l.save();l.translate(207,390);l.scale(.48,.48);paintDensePeak(l,createDensePeak(1201));l.restore();[[80,330,11],[310,340,10],[120,520,8],[290,490,8]].forEach(([x,y,size])=>negativeSpaceFlower(l,{x,y,size,glow:true}));
</script></html>
