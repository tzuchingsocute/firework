<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Butterfly Scale Diversity</title><style>body{margin:0;background:#101522;color:#e9e4f5;font:16px system-ui}main{max-width:1300px;padding:25px;margin:auto}h1{font-size:23px}h2{font-size:18px;margin-top:35px}p{color:#aeb8cc}canvas{display:block;max-width:100%;height:auto;margin:auto}</style><main><h1>蝴蝶尺寸层次 · Seed 6062</h1><p>仅改变整体Scale。角度、开合、位置、数量、材质与时间保持一致。</p><h2>A · Small / Medium / Large 连续尺寸</h2><canvas id="bands"></canvas><h2>B · 20只固定姿态，仅随机尺寸</h2><canvas id="sizes"></canvas><h2>C · 尺寸＋既有角度与开合分布</h2><canvas id="combined"></canvas><p id="stats"></p><h2>D · Before 1.0× / After 分组尺寸，414 × 896</h2><canvas id="live"></canvas></main><script type="module">
import{scaledButterflies,scaleMatrix,paintScaledButterfly,scaleBands}from'/src/firework/butterfly-scale.js';import{createTrailCandidate,paintTrailCandidate}from'/src/firework/trail-candidate.js';import{sampleHead}from'/src/firework/head-candidate.js';import{paintDensePeak,createDensePeak}from'/src/firework/dense-peak.js';const data=scaledButterflies();scaleMatrix(document.querySelector('#bands'),[...scaleBands].reverse().flatMap(b=>Array.from({length:5},(_,i)=>({yaw:0,pitch:0,roll:0,openness:.7,scale:b.min+(b.max-b.min)*i/4,scaleGroup:b.name}))));scaleMatrix(document.querySelector('#sizes'),data.samples.map(v=>({...v,yaw:0,pitch:0,roll:0,openness:.7})));scaleMatrix(document.querySelector('#combined'),data.samples);document.querySelector('#stats').textContent=JSON.stringify(data.counts);const c=document.querySelector('#live');c.width=828;c.height=896;const ctx=c.getContext('2d'),motion=createTrailCandidate(1201),positions=[[78,330],[315,330],[128,530],[300,470],[190,245],[68,445]];window.drawScaleComparison=t=>{for(let panel=0;panel<2;panel++){ctx.save();ctx.translate(panel*414,0);ctx.fillStyle='#15202b';ctx.fillRect(0,0,414,896);ctx.fillStyle='white';ctx.font='14px sans-serif';ctx.fillText(panel?'After / mixed scales':'Before / 1.0x',10,25);ctx.save();ctx.translate(207,390);ctx.scale(.48,.48);if(t>0)paintTrailCandidate(ctx,motion,t);else paintDensePeak(ctx,createDensePeak(1201));ctx.restore();positions.forEach(([x,y],i)=>{const h=motion.head.heads[i],p=sampleHead(h,t),v={...data.samples[i],scale:panel?data.samples[i].scale:1};if(t<=0||p.visible)paintScaledButterfly(ctx,v,t>0?207+p.x*.48:x,t>0?390+p.y*.48:y,9)});ctx.restore()}};window.drawScaleComparison(0);
</script></html>
