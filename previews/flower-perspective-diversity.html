<!doctype html><meta charset="utf-8"><title>Flower Perspective Diversity</title><style>body{background:#101522;color:#eee;font:16px system-ui}main{max-width:1560px;margin:auto}canvas{display:block;max-width:100%;height:auto}h2{margin-top:40px}</style><main><h1>花朵空间透视 · 独立候选</h1><p>保留基础几何。轻微局部深度、空间排序、分组角度抽样。Seed 6312。结构测试暂隐藏花蕊。</p><h2>三瓣 / 四瓣 / 五瓣九视角</h2><canvas id="three"></canvas><canvas id="four"></canvas><canvas id="five"></canvas><h2>空间结构诊断</h2><canvas id="diagnostic"></canvas><h2>相同几何 Before</h2><canvas id="before"></canvas><h2>After · 24个随机姿态</h2><canvas id="random"></canvas><h2>连续旋转 · 三种数量</h2><canvas id="rotation" width="900" height="300"></canvas><h2>原有Glow</h2><canvas id="glow"></canvas><h2>414 × 896实际尺度</h2><canvas id="live" width="414" height="896"></canvas><pre id="stats"></pre></main><script type="module">
import{createOrganicFlower}from'/src/firework/organic-flower-count.js';import{diversityViews as views,diversityMatrix as matrix,sampleFlowerViews,paintDiverseFlower as paint}from'/src/firework/flower-perspective-diversity.js';import{paintDensePeak,createDensePeak}from'/src/firework/dense-peak.js';const reps=[3,4,5].map(petalCount=>createOrganicFlower(6312,{petalCount}));['three','four','five'].forEach((id,i)=>matrix(document.getElementById(id),views.map(view=>({flower:reps[i],view,name:view.name}))));matrix(document.querySelector('#diagnostic'),reps.flatMap(flower=>[views[3],views[5],views[8]].map(view=>({flower,view,diagnostic:true}))));const samples=sampleFlowerViews();matrix(document.querySelector('#random'),samples,6);matrix(document.querySelector('#before'),samples.map(s=>({...s,view:s.before,local:false})),6);matrix(document.querySelector('#glow'),samples.slice(0,12).map(s=>({...s,glow:true})),4);const c=document.querySelector('#live'),ctx=c.getContext('2d');ctx.fillStyle='#15202b';ctx.fillRect(0,0,414,896);ctx.save();ctx.translate(207,390);ctx.scale(.48,.48);paintDensePeak(ctx,createDensePeak(1201));ctx.restore();[[80,330,11],[310,340,10],[120,520,8],[290,490,8],[200,250,9],[65,440,8]].forEach(([x,y,s],i)=>paint(ctx,samples[i].flower,x,y,s,{...samples[i],glow:true}));window.drawRotation=t=>{const c=document.querySelector('#rotation'),ctx=c.getContext('2d');ctx.fillStyle='#101522';ctx.fillRect(0,0,900,300);reps.forEach((f,i)=>paint(ctx,f,150+i*300,145,85,{view:{yaw:65*Math.sin(t*.8),pitch:48*Math.sin(t*.63),roll:25*Math.sin(t*.5)}}))};window.flowerAuto=true;function loop(t){if(window.flowerAuto)window.drawRotation(t/1000);requestAnimationFrame(loop)}requestAnimationFrame(loop);window.samples=samples;document.querySelector('#stats').textContent=JSON.stringify({seed:6312,groups:Object.fromEntries(['front','quarter','side','tilt-combined'].map(g=>[g,samples.filter(s=>s.group===g).length])),rejected:samples.reduce((n,s)=>n+s.attempts-1,0),unresolved:samples.filter(s=>!s.accepted).length,samples:samples.map(({flower,...s})=>({...s,petalCount:flower.petalCount}))},null,2);
</script>
