<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Petal Arrangement and Center</title><style>body{margin:0;background:#101522;color:#ebe5f5;font:16px system-ui}main{max-width:1200px;margin:auto;padding:25px}h1{font-size:23px}h2{font-size:18px;margin-top:35px}p{color:#aab6cc}canvas{display:block;max-width:100%;height:auto;margin:auto}</style><main><h1>五瓣排列与小花心 · B花瓣不变</h1><p>固定五片，不绘制花蕊。A均衡、B轻微错落、C根部稍外移。B暂作主要比较候选，未定稿。</p><h2>A · 三种布局，同花心10%，无Glow</h2><canvas id="layouts"></canvas><h2>B · B布局，花心直径占花宽6 / 8 / 10 / 12 / 14%</h2><canvas id="centers"></canvas><h2>C · B布局根部与10%花心放大</h2><canvas id="detail"></canvas><h2>D · 同外接尺寸Before / After，无花蕊与Glow</h2><canvas id="comparison"></canvas><h2>E · 414 × 896使用尺度</h2><canvas id="live"></canvas></main><script type="module">
import{paintArrangedFlower}from'/src/firework/petal-arrangement.js';import{paintPetalFlower}from'/src/firework/petal-geometry.js';import{paintDensePeak,createDensePeak}from'/src/firework/dense-peak.js';function canvas(id,w,h){const c=document.querySelector('#'+id);c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#101522';ctx.fillRect(0,0,w,h);return ctx}function label(ctx,t,x,y){ctx.fillStyle='#dfe5f5';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText(t,x,y)}const l=canvas('layouts',900,320);['A','B','C'].forEach((v,i)=>{paintArrangedFlower(l,v,i*300+150,145,100,.1);label(l,v,i*300+150,295)});const c=canvas('centers',1250,290);[.06,.08,.1,.12,.14].forEach((r,i)=>{paintArrangedFlower(c,'B',i*250+125,125,90,r);label(c,`${r*100}%`,i*250+125,270)});const d=canvas('detail',500,400);paintArrangedFlower(d,'B',250,200,390,.1);const b=canvas('comparison',700,330);b.save();b.translate(175,150);b.scale(1,1);paintPetalFlower(b,'B',0,0,100,{stamens:false});b.restore();paintArrangedFlower(b,'B',525,150,100,.1);label(b,'Before / old large center',175,310);label(b,'After / B + 10%',525,310);const live=canvas('live',414,896);live.save();live.translate(207,390);live.scale(.48,.48);paintDensePeak(live,createDensePeak(1201));live.restore();[[80,330,11],[310,340,10],[120,520,8],[290,490,8]].forEach(([x,y,s])=>paintArrangedFlower(live,'B',x,y,s,.1,{glow:true}));
</script></html>
