<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Flower Perspective System</title><style>body{margin:0;background:#101522;color:#e9e5f4;font:16px system-ui}main{max-width:1100px;margin:auto;padding:25px}h1{font-size:23px}h2{font-size:18px;margin-top:35px}p{color:#abb6ca}canvas{display:block;max-width:100%;height:auto;margin:auto}</style><main><h1>五瓣花空间透视 · 固定基础花形</h1><p>复用共享Yaw / Pitch / Roll投影，相机距离230。五片独立花瓣按平均深度排序，原有小花心共用投影。花蕊隐藏。</p><h2>A · 九视角，无Glow</h2><canvas id="fixed"></canvas><h2>B · 五色遮挡诊断</h2><canvas id="diagnostic"></canvas><h2>C · 连续旋转</h2><canvas id="motion" width="500" height="400"></canvas><h2>D · Seed 6311，12个空间朝向</h2><canvas id="random"></canvas><h2>E · 414 × 896使用尺度</h2><canvas id="live"></canvas></main><script type="module">
import{flowerPerspectiveViews,flowerPerspectiveMatrix,paintFlowerPerspective,randomFlowerPerspectives}from'/src/firework/flower-perspective.js';import{paintDensePeak,createDensePeak}from'/src/firework/dense-peak.js';flowerPerspectiveMatrix(document.querySelector('#fixed'),flowerPerspectiveViews);flowerPerspectiveMatrix(document.querySelector('#diagnostic'),flowerPerspectiveViews,{diagnostic:true});const views=randomFlowerPerspectives();flowerPerspectiveMatrix(document.querySelector('#random'),views);const c=document.querySelector('#motion'),ctx=c.getContext('2d');window.flowerAuto=true;window.drawFlowerRotation=t=>{ctx.fillStyle='#101522';ctx.fillRect(0,0,500,400);paintFlowerPerspective(ctx,{yaw:45*Math.sin(t*1.2),pitch:30*Math.sin(t*.85),roll:20*Math.sin(t*.6)},250,190,120)};function tick(t){if(window.flowerAuto)window.drawFlowerRotation(t/1000);requestAnimationFrame(tick)}requestAnimationFrame(tick);const l=document.querySelector('#live');l.width=414;l.height=896;const x=l.getContext('2d');x.fillStyle='#15202b';x.fillRect(0,0,414,896);x.save();x.translate(207,390);x.scale(.48,.48);paintDensePeak(x,createDensePeak(1201));x.restore();[[80,330,11],[310,340,10],[120,520,8],[290,490,8]].forEach(([a,b,s],i)=>paintFlowerPerspective(x,views[i],a,b,s,{glow:true}));
</script></html>
